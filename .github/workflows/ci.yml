name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift-package:
    name: Swift package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      # Isolated-conformance and actor-isolation diagnostics only surface under
      # complete checking, and an app target that turns them on gets errors
      # where the package saw nothing.
      - name: Build with complete strict concurrency
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build macOS example
        run: swift build --package-path Example/ListExampleMac

      - name: Build runtime benchmarks
        run: swift build -c release --product ListViewKitBenchmarks

  apple-platforms:
    name: iOS, Mac Catalyst, tvOS and visionOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # `swift test` only runs the AppKit half; the UIKit suites need these.
      - name: Test on iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild \
            -scheme ListViewKit-Package \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/ListViewKitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Test on Mac Catalyst
        run: |
          xcodebuild \
            -scheme ListViewKit-Package \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/ListViewKitCatalystDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Test on tvOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("tvOS")) | .value[] | select(.name | startswith("Apple TV"))][0].udid')
          xcodebuild \
            -scheme ListViewKit-Package \
            -destination "platform=tvOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/ListViewKitTVDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      # Built, not run: a visionOS simulator is not guaranteed on the runner.
      - name: Build for visionOS
        run: |
          xcodebuild \
            -scheme ListViewKit-Package \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ListViewKitVisionDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Build iOS example
        run: |
          xcodebuild \
            -workspace Example/ListExample.xcworkspace \
            -scheme ListExample \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ListExampleDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
